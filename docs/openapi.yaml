openapi: 3.0.3
info:
  title: Oberiz Public API v1
  version: "1.0.6"
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    Oberiz's native, authenticated API for external request clients (Cinetta
    and similar). It lets a client register and query media requests; it is
    not intended to be a full Radarr/Sonarr/Overseerr/Seerr compatibility
    layer — that separate, optional adapter lives under `/radarr/api/v3/*`
    and `/sonarr/api/v3/*` (gated by `overseerr.compat_enabled`) and is out
    of scope for this document.

    Enable **Public API v1** and generate a key from Settings before using
    any of these endpoints. See `docs/Oberiz_API_Integraciones.md` for the
    full prose write-up this spec mirrors.
externalDocs:
  description: Full integration guide (Spanish)
  url: ./Oberiz_API_Integraciones.md

servers:
  - url: "http://{host}:2032/api/v1"
    variables:
      host:
        default: localhost
        description: Hostname or IP of the machine running Oberiz.

security:
  - ApiKeyAuth: []

paths:
  /library/missing:
    get:
      operationId: getMissingReport
      summary: Read a saved report without initiating a check
      description: |
        Requires api.missing_reports_enabled=true in addition to the API key.
        Preserve scope, IDs and job_id when paginating. Current Cinetta inventory
        yields partial provisional results, even with zero candidates.
        See Oberiz_Faltantes_Contrato.md for the JSON contract and limits.
      parameters:
        - {in: query, name: scope, schema: {type: string, enum: [series, collections, series_one, collection_one, all], default: series}}
        - {in: query, name: tmdb_id, schema: {type: integer, minimum: 1}}
        - {in: query, name: tvdb_id, schema: {type: integer, minimum: 1}}
        - {in: query, name: page, schema: {type: integer, minimum: 1}}
        - {in: query, name: job_id, schema: {type: string, maxLength: 100}}
      responses:
        "200":
          description: Immutable report page or queued/running job status
          content:
            application/json:
              schema: {type: object}
        "400": {description: Invalid or incompatible filters}
        "401": {description: Invalid API key}
        "403": {description: Public API or explicit reports permission disabled}
        "404": {description: Explicit job_id not found for these filters}
        "409": {description: No saved report yet; use refresh to create one}
  /library/missing/refresh:
    post:
      operationId: refreshMissingReport
      summary: Explicitly start or reuse a read-only comparison job
      description: |
        Requires explicit reports permission. Writes reports and idempotency only,
        never managed media, requests or downloads. Same action key and filters
        return the same job; different filters with that key return 409.
        Maximum two active jobs; same active scope is coalesced.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 16, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scope: {type: string, enum: [series, collections, series_one, collection_one, all], default: series}
                tmdb_id: {type: integer, minimum: 1}
                tvdb_id: {type: integer, minimum: 1}
      responses:
        "200": {description: Previous idempotent action returned}
        "202": {description: Queued or running job; poll GET with job_id and same filters}
        "400": {description: Invalid filters or missing idempotency key}
        "401": {description: Invalid API key}
        "403": {description: Public API or reports permission disabled}
        "409": {description: No received Cinetta inventory yet or conflicting idempotency key}
        "428": {description: TMDB not configured}
        "429": {description: Too many concurrent jobs}
  /library:
    put:
      operationId: reportExternalLibrary
      summary: Report Cinetta inventory without accessing its files
      description: |
        API-key authorization runs before JSON extraction. At most two inventory
        requests are admitted at once; excess requests return 429 rather than
        queueing large bodies. Maximum body size is 128 MiB, with 1000000 movie
        and episode entries combined and 1024 roots. Paths are bounded to 4096
        bytes; codec/HDR strings to 128 bytes. Conflicting identities for the
        same path and invalid episode ranges or measurements are rejected.

        Reports are additive by default: omitted files remain present. Setting
        allow_large_removal=true explicitly confirms omissions only underneath
        available reported roots containing at least one managed reported file.
        Offline, suddenly empty and unreported roots remain protected. Clients
        must not enable removal confirmation automatically.

        Select library.source=cinetta before submitting (local mode returns 409).
        Oberiz does not access NAS files. Optional naming is independently
        disabled by default and can only be executed through qBittorrent.
        superseded is always empty and reported paths are not matched to
        download ownership. Cinetta must not interpret
        the response as a file-action command. Use one reporting installation
        and serialize reports; multi-client snapshot ordering is not supported.
      tags: [Library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                movies:
                  type: array
                  items:
                    type: object
                    required: [tmdb_id, path]
                    properties:
                      tmdb_id: {type: integer, minimum: 1}
                      path: {type: string, maxLength: 4096}
                episodes:
                  type: array
                  items:
                    type: object
                    required: [series_tmdb_id, season, episode, path]
                    properties:
                      series_tmdb_id: {type: integer, minimum: 1}
                      season: {type: integer, minimum: 0}
                      episode: {type: integer, minimum: 1}
                      episode_end: {type: integer, minimum: 1, nullable: true}
                      path: {type: string, maxLength: 4096}
                roots:
                  type: array
                  maxItems: 1024
                  items:
                    type: object
                    required: [path, available]
                    properties:
                      path: {type: string, maxLength: 4096}
                      available: {type: boolean}
                allow_large_removal: {type: boolean, default: false}
                sync:
                  type: object
                  description: Optional protocol 1 checkpoint. Deltas never confirm removals; revision mismatches return 409.
                  required: [revision, full]
                  properties:
                    revision: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
                    base_revision: {type: string, nullable: true, pattern: '^[a-fA-F0-9]{64}$'}
                    full: {type: boolean}
                collections:
                  type: array
                  maxItems: 2000
                  description: Existing Cinetta metadata only. At most 20000 parts total; no images or extra connection required.
                  items:
                    type: object
                    required: [id, name, parts]
                    properties:
                      id: {type: integer, minimum: 1}
                      name: {type: string, maxLength: 960}
                      parts:
                        type: array
                        items:
                          type: object
                          required: [id, title]
                          properties:
                            id: {type: integer, minimum: 1}
                            title: {type: string, maxLength: 960}
                            release_date: {type: string, nullable: true, maxLength: 10}
      responses:
        "200":
          description: Inventory accepted; no filesystem action performed.
        "400":
          description: Invalid JSON, paths, metadata, ranges or file identities.
        "409":
          description: Select Cinetta as the inventory source, or reconcile a mismatched incremental revision with a full report.
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/ApiDisabled"
        "428":
          description: Public API key is not configured.
        "413":
          description: Body or collection limits exceeded.
        "429":
          description: Two inventory requests are already active; retry later.
  /status:
    get:
      operationId: getStatus
      summary: Service status and version
      tags: [Status]
      responses:
        "200":
          description: Oberiz is reachable and the API key is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStatus"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/ApiDisabled"
        "412":
          $ref: "#/components/responses/ApiKeyNotConfigured"

  /quality-profiles:
    get:
      operationId: listQualityProfiles
      summary: List enabled quality profiles
      description: |
        Returns only *enabled* movie and series quality profiles. Each one
        carries `request_quality` (`standard` or `4k`), set per-profile in
        Settings → Profiles via "4K profile for API requests" — clients
        should filter candidate profiles by this flag before offering the
        user a choice.
      tags: [Profiles]
      responses:
        "200":
          description: Enabled quality profiles, movies and series mixed.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QualityProfile"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/ApiDisabled"
        "412":
          $ref: "#/components/responses/ApiKeyNotConfigured"

  /requests:
    get:
      operationId: listRequests
      summary: List recent media requests
      description: Returns the most recent 250 requests, newest first.
      tags: [Requests]
      responses:
        "200":
          description: Recent requests with their computed status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaRequestView"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/ApiDisabled"
        "412":
          $ref: "#/components/responses/ApiKeyNotConfigured"
    post:
      operationId: createRequest
      summary: Create (or idempotently reapply) a media request
      description: |
        Creates a request for a movie or series. Sending the same
        `client_name` + `client_request_id` pair again is idempotent and
        returns the existing request instead of creating a duplicate — except
        for a series retried with a new `requested_seasons`, which updates
        that series' season selection in place (e.g. adding season 2 once
        it's out, to a series Cinetta already requested for season 1).

        This does not trigger a global automation cycle: only the media item
        just requested is processed, in the background, after the response
        is returned.
      tags: [Requests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
            examples:
              movie:
                summary: Minimal movie request
                value:
                  media_type: movie
                  tmdb_id: 19995
              seriesWithProfile:
                summary: Series with an explicit profile and monitor mode
                value:
                  media_type: series
                  tmdb_id: 1399
                  quality_profile_id: 4
                  client_name: cinetta
                  client_request_id: "184"
                  monitored: true
                  monitor_mode: all
                  requested_by: user_42
      responses:
        "201":
          description: Request created (or the existing idempotent match returned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRequestView"
        "400":
          description: Invalid `media_type`, or `quality_profile_id` doesn't match `media_type`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/ApiDisabled"
        "412":
          description: The Public API key, or TMDB, is not configured yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "502":
          description: TMDB could not be reached or returned an error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"

  /requests/{id}:
    get:
      operationId: getRequest
      summary: Get one request's detail and computed status
      tags: [Requests]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Oberiz's own request id (from the create/list response), not `client_request_id`.
      responses:
        "200":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRequestView"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "403":
          $ref: "#/components/responses/ApiDisabled"
        "404":
          description: No request with that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
        "412":
          $ref: "#/components/responses/ApiKeyNotConfigured"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        The key generated in Settings → Public API v1. `Authorization: Bearer`
        is not supported by the current implementation.

  responses:
    InvalidApiKey:
      description: Missing or incorrect `X-Api-Key`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    ApiDisabled:
      description: Public API v1 is disabled in Settings.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
    ApiKeyNotConfigured:
      description: Public API v1 is enabled but no key has been generated yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"

  schemas:
    ErrorMessage:
      type: string
      description: Plain-text error message (not a JSON object).

    PublicStatus:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          example: "1.0.6"
        inventory_sync:
          type: object
          description: Capabilities and accepted checkpoint for the existing authenticated inventory sender.
          properties:
            protocol: {type: integer, enum: [1]}
            revision: {type: string, nullable: true}
            check_hours: {type: integer, minimum: 1, maximum: 168, default: 1}
            full_days: {type: integer, minimum: 1, maximum: 365, default: 7}

    QualityRules:
      type: object
      description: Scoring weights and acceptance rules evaluated against each release.
      required:
        - resolutions
        - sources
        - codecs
        - hdr
        - audio
        - reject_terms
        - prefer_terms
        - allow_unknown_resolution
        - allow_unknown_source
        - series_prefer_pack
        - series_accept_complete
      properties:
        resolutions:
          type: object
          additionalProperties:
            type: integer
        sources:
          type: object
          additionalProperties:
            type: integer
        codecs:
          type: object
          additionalProperties:
            type: integer
        hdr:
          type: object
          additionalProperties:
            type: integer
        audio:
          type: object
          additionalProperties:
            type: integer
        reject_terms:
          type: array
          items:
            type: string
        prefer_terms:
          type: object
          additionalProperties:
            type: integer
        allow_unknown_resolution:
          type: boolean
        allow_unknown_source:
          type: boolean
        series_prefer_pack:
          type: boolean
        series_accept_complete:
          type: boolean

    QualityProfile:
      type: object
      required:
        - id
        - name
        - media_type
        - enabled
        - upgrade_allowed
        - cutoff_score
        - min_seeders
        - qbittorrent_category
        - qbittorrent_tags_template
        - is_default
        - request_quality
        - rules
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        media_type:
          type: string
          enum: [movie, series]
        enabled:
          type: boolean
        upgrade_allowed:
          type: boolean
        cutoff_score:
          type: integer
        min_seeders:
          type: integer
          format: int64
        min_size_mb:
          type: integer
          format: int64
          nullable: true
        max_size_mb:
          type: integer
          format: int64
          nullable: true
        language_profile_id:
          type: integer
          format: int64
          nullable: true
        language_profile_name:
          type: string
          nullable: true
        qbittorrent_category:
          type: string
        qbittorrent_tags_template:
          type: string
        is_default:
          type: boolean
        request_quality:
          type: string
          enum: [standard, "4k"]
          description: Set via "4K profile for API requests" in Settings → Profiles.
        rules:
          $ref: "#/components/schemas/QualityRules"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateRequest:
      type: object
      required: [media_type, tmdb_id]
      properties:
        media_type:
          type: string
          enum: [movie, series]
        tmdb_id:
          type: integer
          format: int64
          description: TMDB id of the movie or series.
        quality_profile_id:
          type: integer
          format: int64
          nullable: true
          description: Falls back to the default profile for `media_type` when omitted.
        client_request_id:
          type: string
          nullable: true
          description: Combined with `client_name`, makes creation idempotent.
        client_name:
          type: string
          nullable: true
          example: cinetta
        monitored:
          type: boolean
          nullable: true
          default: true
        monitor_mode:
          type: string
          nullable: true
          description: Series only. Defaults to `all` unless `requested_seasons` is set. Use `future` to follow episodes airing from the date tracking starts; that date is preserved across metadata refreshes.
        requested_seasons:
          type: array
          nullable: true
          items:
            type: integer
          description: Series only — the exact season numbers to monitor.
        monitor_future_seasons:
          type: boolean
          nullable: true
          default: false
          description: Series only — keep monitoring seasons that air later, without activating past unselected seasons.
        requested_by:
          type: string
          nullable: true
          description: Free-text audit label.

    MediaRequestView:
      description: A `MediaRequestRow`'s fields, flattened, plus the computed `status` and resolved `title`.
      allOf:
        - $ref: "#/components/schemas/MediaRequestRow"
        - type: object
          required: [status, title, availability_status, seasons]
          properties:
            status:
              type: string
              description: |
                For movies: `available | downloading | searching | pending`.
                For series: `available | downloading | searching | monitoring | pending`.
                `pending` means no media item is associated with the request yet.
            title:
              type: string
              nullable: true
            availability_status:
              type: string
              nullable: true
              enum: [missing, partially_available, up_to_date, complete]
              description: Actual library availability, separate from acquisition status. An ongoing season can be up to date without being complete.
            seasons:
              type: array
              items:
                $ref: "#/components/schemas/SeasonAvailability"

    SeasonAvailability:
      type: object
      required: [season_number, available_episodes, missing_aired_episodes, future_episodes, availability]
      properties:
        season_number:
          type: integer
        available_episodes:
          type: integer
        missing_aired_episodes:
          type: integer
        future_episodes:
          type: integer
        availability:
          type: string
          enum: [missing, partially_available, up_to_date, complete]

    MediaRequestRow:
      type: object
      required:
        - id
        - media_type
        - tmdb_id
        - monitored
        - monitor_future_seasons
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        media_type:
          type: string
          enum: [movie, series]
        tmdb_id:
          type: integer
          format: int64
        media_id:
          type: integer
          format: int64
          nullable: true
        quality_profile_id:
          type: integer
          format: int64
          nullable: true
        client_request_id:
          type: string
          nullable: true
        client_name:
          type: string
          nullable: true
        monitored:
          type: boolean
        monitor_mode:
          type: string
          nullable: true
        requested_seasons:
          type: string
          nullable: true
          description: JSON-encoded array of season numbers, as stored (not a native array).
        monitor_future_seasons:
          type: boolean
        requested_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
