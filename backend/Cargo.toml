[package]
name = "oberiz"
version = "1.0.11"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
anyhow = "1"
# default-features disabled deliberately: reqwest's own defaults include
# "default-tls", which pulls in native-tls -> openssl-sys regardless of
# rustls-tls being listed alongside it. That went unnoticed on Windows
# (default-tls there is schannel, no extra C dependency), but every Linux
# build — including the one already shipped — was silently linking against
# system OpenSSL on top of rustls, and a musl cross-compile has no OpenSSL
# sysroot to find at all. The other three entries restore reqwest's other
# defaults (charset detection, HTTP/2, system proxy env vars) that would
# otherwise also be lost by turning default-features off.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "multipart", "charset", "http2", "system-proxy"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
scraper = "0.22"
regex = "1"
url = "2"
urlencoding = "2"
html-escape = "0.2"
argon2 = "0.5"
sha2 = "0.10"
sha1 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
async-trait = "0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }
windows-service = "0.8"
