name: Build release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release tag to publish
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write
  packages: write

jobs:
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux installer
        run: bash scripts/build-linux-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oberiz-linux-installer
          path: dist/*.tar.gz

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows package
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $package = "oberiz-$version-windows-x86_64"
          $staging = "dist/$package"
          npm ci --prefix frontend
          npm run build --prefix frontend
          cargo build --release --locked --manifest-path backend/Cargo.toml
          New-Item -ItemType Directory -Force -Path "$staging/config/indexers/custom", "$staging/config/indexers/upstream" | Out-Null
          Copy-Item backend/target/release/oberiz.exe "$staging/Oberiz.exe"
          Copy-Item frontend/dist "$staging/frontend" -Recurse
          Copy-Item config/* "$staging/config" -Recurse -Force
          Copy-Item packaging/windows/Start-Oberiz.bat "$staging/Start-Oberiz.bat"
          Copy-Item packaging/windows/Start-Oberiz-Installed.bat "$staging/Start-Oberiz-Installed.bat"
          Compress-Archive -Path $staging -DestinationPath "dist/$package.zip"
      - name: Build Windows setup executable
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $version = (Select-String -Path backend/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $package = "oberiz-$version-windows-x86_64"
          $sourceRoot = (Resolve-Path "dist/$package").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceRoot=$sourceRoot" "/DMyAppVersion=$version" packaging/windows/oberiz.iss
      - uses: actions/upload-artifact@v4
        with:
          name: oberiz-windows-installer
          path: |
            dist/*.zip
            dist/*-setup.exe

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oberiz:${{ inputs.release_version || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/oberiz:latest

  publish-release:
    needs: [linux-package, windows-package, docker-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
