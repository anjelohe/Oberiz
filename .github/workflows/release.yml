name: Build release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: Release tag to publish
        required: true
        default: v1.0.0
        type: string
      windows_only:
        description: Build and publish only the Windows portable ZIP and installer
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

# Actions are pinned by commit SHA rather than a floating tag (a tag can be
# moved to point at different, potentially compromised code; a commit SHA
# cannot) — the version is left in a trailing comment for readability.
# Dependabot (.github/dependabot.yml) opens a PR to bump these.
jobs:
  # Nothing packages or publishes for this tag/ref until its own checks pass:
  # ci.yml only triggers on pushes to main and on PRs, never on a tag push,
  # so without this a tag could point at a commit that fails tests/clippy/
  # build and every job below would still happily package and publish it —
  # including overwriting the :latest Docker image.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, as of 2026-09
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Backend tests
        run: cargo test --manifest-path backend/Cargo.toml --locked
      - name: Frontend typecheck and build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Version matches the tag/release being built
        # An arbitrary tag or a typo'd workflow_dispatch release_version
        # otherwise sails through unnoticed and publishes artifacts labeled
        # with a version that doesn't match what Cargo.toml/package.json
        # actually say was built.
        run: |
          ref="${{ inputs.release_version || github.ref_name }}"
          expected="${ref#v}"
          backend_version=$(grep -m1 '^version = "' backend/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          frontend_version=$(node -p "require('./frontend/package.json').version")
          if [ "$backend_version" != "$expected" ] || [ "$frontend_version" != "$expected" ]; then
            echo "::error::Tag/release_version '$ref' (expects version '$expected') does not match backend Cargo.toml ($backend_version) and/or frontend package.json ($frontend_version)."
            exit 1
          fi

  linux-package:
    needs: verify
    if: ${{ success() && inputs.windows_only != true }}
    runs-on: ubuntu-latest
    env:
      # Built against musl instead of this runner's glibc — see the comment
      # in build-linux-package.sh — so the published tarball has no
      # unverified minimum-glibc requirement implied by whichever version
      # happens to ship on ubuntu-latest.
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, as of 2026-09
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl build tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Linux installer
        run: bash scripts/build-linux-package.sh
      - name: Generate SBOM (CycloneDX, backend dependency tree)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path backend/Cargo.toml --format json
          cp backend/oberiz.cdx.json dist/oberiz-sbom.cdx.json
      - name: Checksum release assets
        run: (cd dist && sha256sum *.tar.gz oberiz-sbom.cdx.json > SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oberiz-linux-installer
          path: |
            dist/*.tar.gz
            dist/oberiz-sbom.cdx.json
            dist/SHA256SUMS-linux.txt

  windows-package:
    needs: verify
    if: ${{ success() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, as of 2026-09
      - name: Build Windows package
        shell: pwsh
        run: |
          $version = (Select-String -Path backend/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $package = "oberiz-$version-windows-x86_64"
          $staging = "dist/$package"
          npm ci --prefix frontend
          npm run build --prefix frontend
          cargo build --release --locked --manifest-path backend/Cargo.toml
          New-Item -ItemType Directory -Force -Path "$staging/config/indexers/custom", "$staging/config/indexers/upstream" | Out-Null
          Copy-Item backend/target/release/oberiz.exe "$staging/Oberiz.exe"
          Copy-Item frontend/dist "$staging/frontend" -Recurse
          Copy-Item config/* "$staging/config" -Recurse -Force
          Copy-Item packaging/windows/Start-Oberiz.bat "$staging/Start-Oberiz.bat"
          Copy-Item packaging/windows/Start-Oberiz.vbs "$staging/Start-Oberiz.vbs"
          Copy-Item packaging/windows/Start-Oberiz-Installed.bat "$staging/Start-Oberiz-Installed.bat"
          Copy-Item packaging/windows/Start-Oberiz-Installed.vbs "$staging/Start-Oberiz-Installed.vbs"
          Copy-Item packaging/windows/Start-Oberiz-Tray.vbs "$staging/Start-Oberiz-Tray.vbs"
          Copy-Item packaging/windows/oberiz.ico "$staging/oberiz.ico"
          Compress-Archive -Path $staging -DestinationPath "dist/$package.zip"
      - name: Build Windows setup executable
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $version = (Select-String -Path backend/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $package = "oberiz-$version-windows-x86_64"
          $sourceRoot = (Resolve-Path "dist/$package").Path
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceRoot=$sourceRoot" "/DMyAppVersion=$version" packaging/windows/oberiz.iss
      - name: Checksum release assets
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip, dist/*-setup.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding utf8 dist/SHA256SUMS-windows.txt
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oberiz-windows-installer
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS-windows.txt

  docker-image:
    # Also waits on the other two packaging jobs, not just verify: pushing
    # :latest from here while a sibling platform build is failing would
    # publish an image for a "release" that isn't actually fully built,
    # with no way to tell from the image tag alone that something else
    # failed.
    needs: [verify, linux-package, windows-package]
    if: ${{ success() && inputs.windows_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          # amd64 is native on this runner; arm64 (Raspberry Pi, ARM NAS,
          # Apple Silicon hosts) is cross-built under QEMU emulation, so it
          # takes noticeably longer than an amd64-only build.
          platforms: linux/amd64,linux/arm64
          push: true
          # BuildKit-native attestations: an SBOM and build provenance get
          # attached to the published image itself (inspect with `docker
          # buildx imagetools inspect --format '{{ json .SBOM }}' <image>` or
          # `docker scout`), on top of the CycloneDX file shipped with the
          # Linux/Windows packages above.
          sbom: true
          provenance: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oberiz:${{ inputs.release_version || github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/oberiz:latest

  publish-release:
    # verify's result is checked explicitly, not just folded into the
    # failure/cancelled scan below: when verify fails, linux-package/
    # windows-package/docker-image all skip themselves (their own `if:`
    # requires success()) rather than failing — and a skipped result isn't
    # 'failure' or 'cancelled', so without this a failed verify would still
    # let this job run and publish a release built from nothing.
    needs: [verify, linux-package, windows-package, docker-image]
    if: ${{ always() && needs.verify.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          pattern: oberiz-*
          merge-multiple: true
      - name: Merge platform checksum files
        run: |
          cd release-assets
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.release_version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
