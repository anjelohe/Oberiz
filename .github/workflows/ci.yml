name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned by commit SHA rather than a floating tag (a tag can be
# moved to point at different, potentially compromised code; a commit SHA
# cannot) — the version is left in a trailing comment for readability.
# Dependabot (.github/dependabot.yml) opens a PR to bump these.
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest matters here beyond the usual cross-platform check:
        # service.rs/tray.rs are #[cfg(windows)]-only and would otherwise
        # never be compiled, checked or tested by CI at all.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, as of 2026-09
        with:
          components: rustfmt, clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --manifest-path backend/Cargo.toml --locked

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Typecheck and build
        run: npm run build --prefix frontend
