version: 2
updates:
  # Pinning Docker base images to a digest (see Dockerfile) only stays secure
  # if something keeps that digest current — this is that something.
  - package-ecosystem: docker
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    open-pull-requests-limit: 0
    directory: "/backend"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    open-pull-requests-limit: 0
    directory: "/frontend"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: weekly
